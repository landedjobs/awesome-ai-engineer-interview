name: Local link check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  local-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check local Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            './**/*.md'
          fail: true
